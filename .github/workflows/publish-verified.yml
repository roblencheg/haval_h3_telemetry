name: Publish verified APK

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'publish-v1.2.1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify APK checksum
        run: sha256sum --check dist/Haval-H3-Telemetry-v1.2.1-release.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.1 \
            dist/Haval-H3-Telemetry-v1.2.1-release.apk \
            dist/Haval-H3-Telemetry-v1.2.1-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Haval H3 Telemetry v1.2.1" \
            --notes "Обезличенный публичный релиз. Package ID: app.havalh3.telemetry. Исправлена автозагрузка на штатной ГУ."
