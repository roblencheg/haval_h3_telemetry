name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: haval-h3-telemetry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-test-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          H3_KEYSTORE_BASE64: ${{ secrets.H3_KEYSTORE_BASE64 }}
        run: echo "$H3_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/haval-h3-telemetry.jks"

      - name: Build signed test APK
        env:
          H3_KEYSTORE_PASSWORD: ${{ secrets.H3_KEYSTORE_PASSWORD }}
          H3_KEY_ALIAS: ${{ secrets.H3_KEY_ALIAS }}
          H3_KEY_PASSWORD: ${{ secrets.H3_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PH3_KEYSTORE_PATH="$RUNNER_TEMP/haval-h3-telemetry.jks" \
            -PH3_KEYSTORE_PASSWORD="$H3_KEYSTORE_PASSWORD" \
            -PH3_KEY_ALIAS="$H3_KEY_ALIAS" \
            -PH3_KEY_PASSWORD="$H3_KEY_PASSWORD"

      - name: Verify and name APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk haval-h3-telemetry-signed-test.apk
          sha256sum haval-h3-telemetry-signed-test.apk > haval-h3-telemetry-signed-test.apk.sha256

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: haval-h3-telemetry-signed-test
          path: |
            haval-h3-telemetry-signed-test.apk
            haval-h3-telemetry-signed-test.apk.sha256
          if-no-files-found: error
          retention-days: 14
