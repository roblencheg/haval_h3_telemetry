name: Publish diagnostic release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'publish-v1.3.0-diag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK checksum
        run: echo "215a37cf39edb2db3bd1b6ba4aa960000d277f9868b19da9424ee37d75cb665f  release-assets/H3Telemetry-v1.3.0-diag-release.apk" | sha256sum -c -
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0-diag \
            release-assets/H3Telemetry-v1.3.0-diag-release.apk \
            --repo "${{ github.repository }}" \
            --target main \
            --title "H3 Telemetry 1.3.0 — диагностика камеры" \
            --prerelease \
            --notes "Диагностическая сборка для определения события кнопки левого джойстика и доступного интерфейса фронтальной камеры. Также исправлена ранняя автозагрузка. Устанавливается поверх 1.2.1 без удаления настроек."
