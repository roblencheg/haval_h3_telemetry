name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          H3_KEYSTORE_BASE64: ${{ secrets.H3_KEYSTORE_BASE64 }}
        run: echo "$H3_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/haval-h3-telemetry.jks"

      - name: Build signed release APK
        env:
          H3_KEYSTORE_PASSWORD: ${{ secrets.H3_KEYSTORE_PASSWORD }}
          H3_KEY_ALIAS: ${{ secrets.H3_KEY_ALIAS }}
          H3_KEY_PASSWORD: ${{ secrets.H3_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PH3_KEYSTORE_PATH="$RUNNER_TEMP/haval-h3-telemetry.jks" \
            -PH3_KEYSTORE_PASSWORD="$H3_KEYSTORE_PASSWORD" \
            -PH3_KEY_ALIAS="$H3_KEY_ALIAS" \
            -PH3_KEY_PASSWORD="$H3_KEY_PASSWORD"

      - name: Verify and name APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk haval-h3-telemetry.apk
          sha256sum haval-h3-telemetry.apk > haval-h3-telemetry.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            haval-h3-telemetry.apk \
            haval-h3-telemetry.apk.sha256 \
            --generate-notes \
            --title "Haval H3 Telemetry $GITHUB_REF_NAME"
